name: Build IPA
run-name: Source build · ${{ inputs.source_ref || 'latest release' }}
on:
  workflow_dispatch:
    inputs:
      prepared_input:
        description: iOS prepared package JSON (see README)
        type: string
        required: true
      output_repository:
        description: Private repository for generated IPA and temporary build files (OWNER/REPO)
        type: string
        required: true
      source_repository:
        description: Upstream source repository or your fork
        type: string
        default: shh632058099/d2r-mobile
      source_ref:
        description: Branch, tag or commit (empty uses the latest release)
        type: string
        default: main
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/pack.yml
    with:
      prepared_input: ${{ inputs.prepared_input }}
      output_repository: ${{ inputs.output_repository }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
    secrets:
      BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
